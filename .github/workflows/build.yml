name: Bygg APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testa och bygg
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Byt namn på APK
        run: cp app/build/outputs/apk/release/app-release.apk L-AD-blocker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: L-AD-blocker-apk
          path: L-AD-blocker.apk

      - name: Publicera som release (för nedladdning direkt i mobilen)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: L-AD-blocker 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: L-AD-blocker.apk
          body: |
            Ladda ner **L-AD-blocker.apk** nedan på din Android-telefon och öppna filen för att installera.
            Se README för instruktioner.

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: L-AD-blocker-apk

      - name: Aktivera KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Skärmdumpar i emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: ./.github/scripts/screenshots.sh

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
