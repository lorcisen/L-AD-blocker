// A stand-in for the Facebook app used only by CI to test AdHiderService. Never published.
plugins {
    id "com.android.application"
}

android {
    namespace "com.facebook.katana"
    compileSdk 35
    defaultConfig {
        applicationId "com.facebook.katana"
        minSdk 24
        targetSdk 35
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
